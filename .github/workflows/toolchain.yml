name: Toolchain

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify:
    name: Verify toolchain
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          # setup-java represents Temurin 21.0.12.1+1 using this SemVer form.
          java-version: '21.0.12+101.0.LTS'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@1.98.0
        with:
          components: rustfmt, clippy

      - name: Verify toolchain versions
        run: ./scripts/verify-toolchain.sh

      - name: Install frontend dependencies
        run: npm ci

      - name: Lint frontend
        run: npm run lint:desktop

      - name: Test frontend
        run: npm run test:desktop

      - name: Build frontend
        run: npm run build:desktop

      - name: Build and test Java modules
        run: ./gradlew build
